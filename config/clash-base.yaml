# Generated by scripts/generate_dns.py; requires Mihomo.
mode: rule
log-level: info
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.home.arpa'
  - localhost
  respect-rules: false
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  nameserver:
  - https://cloudflare-dns.com/dns-query#DNS-CF-Auto
  - https://dns.google/dns-query#DNS-Google-Auto
  nameserver-policy:
    geosite:cn:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
    geosite:netflix:
    - https://cloudflare-dns.com/dns-query#🎥 Netflix
    - https://dns.google/dns-query#🎥 Netflix
    geosite:hbo:
    - https://cloudflare-dns.com/dns-query#🎬 HBO
    - https://dns.google/dns-query#🎬 HBO
    geosite:tiktok:
    - https://cloudflare-dns.com/dns-query#👯‍♂️ TikTok
    - https://dns.google/dns-query#👯‍♂️ TikTok
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080
proxies: []
proxy-groups: []
rules: []
